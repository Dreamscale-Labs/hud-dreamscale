[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hud-dreamscale"
version = "0.1.0"
description = "HUD robotics evaluations powered by Dreamscale inference"
requires-python = ">=3.12,<3.13"
license = "MIT"
readme = "README.md"
dependencies = [
  "dreamscale==0.1.0a27",
  "hud[robot] @ git+https://github.com/hud-evals/hud-python@0b63b4d3b9acb6d095e0886e18b2c905219e1e5a",
  "numpy==2.2.6",
]

[project.scripts]
hud-dreamscale = "hud_dreamscale.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=1,<2", "ruff>=0.12"]

[tool.uv]
prerelease = "if-necessary-or-explicit"
# OpenPI 0.1.2 pins NumPy <2; HUD uses its array codec, validated here on NumPy 2.
# This deliberate override is scoped to this uv project, not a pip compatibility claim.
override-dependencies = ["numpy==2.2.6"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
